<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Pelajaran Sekolah</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; min-height: 100vh; padding: 20px 15px; }
        .container { width: 100%; max-width: 480px; background: #1e293b; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); border: 1px solid #334155; position: relative; }
        
        .header { background: linear-gradient(135deg, #2563eb, #1d4ed8); padding: 25px 20px 15px 20px; text-align: center; }
        .header h1 { font-size: 1.5rem; letter-spacing: 1px; color: #ffffff; margin-bottom: 8px; text-transform: uppercase; font-weight: 700; }
        
        .datetime-box { font-size: 0.9rem; color: #dbeafe; margin-bottom: 12px; }
        .status-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(15, 23, 42, 0.85); padding: 8px 16px; border-radius: 30px; font-size: 0.85rem; font-weight: 600; border: 1px solid rgba(255, 255, 255, 0.1); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        
        .status-green { background-color: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .status-yellow { background-color: #facc15; box-shadow: 0 0 8px #facc15; }
        .status-white { background-color: #f8fafc; box-shadow: 0 0 8px #f8fafc; }
        
        .wave-svg { display: block; width: 100%; height: 35px; }
        .wave-svg path { fill: #1d4ed8; }
        
        .content { padding: 20px; }
        
        .section-box { background: #0f172a; border-radius: 12px; padding: 15px; margin-bottom: 20px; border-left: 4px solid #3b82f6; }
        .section-title { font-size: 0.85rem; text-transform: uppercase; color: #60a5fa; letter-spacing: 0.5px; margin-bottom: 8px; font-weight: 700; }
        
        .summary-list { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
        .summary-item { background: #1e293b; color: #e2e8f0; padding: 5px 12px; border-radius: 6px; font-size: 0.85rem; border: 1px solid #334155; font-weight: 600; }
        
        .timeline { display: flex; flex-direction: column; gap: 10px; }
        .timeline-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 12px 15px; border-radius: 10px; border: 1px solid #1e293b; }
        .timeline-item.active { border-color: #3b82f6; background: #1e3a8a; }
        .time-text { font-size: 0.85rem; color: #60a5fa; font-weight: 600; width: 105px; flex-shrink: 0; }
        .subject-text { font-size: 0.9rem; color: #f1f5f9; flex-grow: 1; text-align: right; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Jadwal Pelajaran</h1>
        <div class="datetime-box" id="datetime-display">Memuat tanggal & waktu...</div>
        <div class="status-badge">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">Memuat status...</span>
        </div>
    </div>
    <svg class="wave-svg" viewBox="0 0 500 150" preserveAspectRatio="none">
        <path d="M0.00,49.98 C150.00,150.00 349.20,-49.98 500.00,49.98 L500.00,0.00 L0.00,0.00 Z"></path>
    </svg>

    <div class="content">
        <div class="section-box">
            <div class="section-title" id="day-title">MATA PELAJARAN HARI INI</div>
            <ul class="summary-list" id="summary-list">
                <!-- Diisi otomatis oleh JavaScript -->
            </ul>
        </div>

        <div class="section-title" style="margin-bottom: 10px;">RINCIAN WAKTU</div>
        <div class="timeline" id="timeline-container">
            <!-- Diisi otomatis oleh JavaScript -->
        </div>
    </div>
</div>

    <script>
    const days = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
    const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

    // Data Jadwal Pelajaran
    const scheduleData = {
        1: { // Senin
            summary: ["Upacara", "MTK", "PABP", "B. Jawa", "Informatika"],
            timeline: [
                { start: "06:30", end: "07:40", name: "Upacara Bendera" },
                { start: "07:40", end: "09:00", name: "Mapel ke 1 MTK" },
                { start: "09:00", end: "09:40", name: "Mapel ke 2 PABP" },
                { start: "09:40", end: "10:00", name: "Istirahat Pertama" },
                { start: "10:00", end: "11:20", name: "Mapel ke 3 B. Jawa" },
                { start: "11:20", end: "12:00", name: "Mapel ke 4 Informatika" },
                { start: "12:00", end: "12:40", name: "Istirahat Kedua" },
                { start: "12:40", end: "14:00", name: "Lanjutan Informatika" },
                { start: "14:00", end: "23:59", name: "Pulang / Selesai" }
            ]
        },
        2: { // Selasa
            summary: ["B. Sunda", "Seni Budaya", "B. Inggris", "KKA"],
            timeline: [
                { start: "06:30", end: "07:40", name: "Pembiasaan / Literasi" },
                { start: "07:40", end: "09:00", name: "Mapel ke 1 B. Sunda" },
                { start: "09:00", end: "09:40", name: "Mapel ke 2 Seni Budaya" },
                { start: "09:40", end: "10:00", name: "Istirahat Pertama" },
                { start: "10:00", end: "11:20", name: "Mapel ke 3 B. Inggris" },
                { start: "11:20", end: "12:00", name: "Mapel ke 4 KKA" },
                { start: "12:00", end: "12:40", name: "Istirahat Kedua" },
                { start: "12:40", end: "14:00", name: "Lanjutan KKA" },
                { start: "14:00", end: "23:59", name: "Pulang / Selesai" }
            ]
        },
        3: { // Rabu
            summary: ["PJOK", "IPA", "B. Indo"],
            timeline: [
                { start: "06:30", end: "07:40", name: "Persiapan KBM" },
                { start: "07:40", end: "09:00", name: "Mapel ke 1 PJOK" },
                { start: "09:00", end: "09:40", name: "Mapel ke 2 IPA" },
                { start: "09:40", end: "10:00", name: "Istirahat Pertama" },
                { start: "10:00", end: "11:20", name: "Mapel ke 3 IPA (Lanjutan)" },
                { start: "11:20", end: "12:00", name: "Mapel ke 4 B. Indo" },
                { start: "12:00", end: "12:40", name: "Istirahat Kedua" },
                { start: "12:40", end: "14:00", name: "Mapel ke 4 (Lanjutan) B. Indo" },
                { start: "14:00", end: "23:59", name: "Pulang / Selesai" }
            ]
        },
        4: { // Kamis
            summary: ["PABP", "IPS", "B. Indo", "MTK"],
            timeline: [
                { start: "06:30", end: "07:40", name: "Pembiasaan Agama" },
                { start: "07:40", end: "09:00", name: "Mapel ke 1 PABP" },
                { start: "09:00", end: "09:40", name: "Mapel ke 2 IPS" },
                { start: "09:40", end: "10:00", name: "Istirahat Pertama" },
                { start: "10:00", end: "11:20", name: "Mapel ke 3 B. Indo" },
                { start: "11:20", end: "12:00", name: "Mapel ke 4 MTK" },
                { start: "12:00", end: "12:40", name: "Istirahat Kedua" },
                { start: "12:40", end: "14:00", name: "Lanjutan MTK" },
                { start: "14:00", end: "23:59", name: "Pulang / Selesai" }
            ]
        },
        5: { // Jumat
            summary: ["Pancasila", "B. Inggris", "IPA"],
            timeline: [
                { start: "06:30", end: "07:40", name: "Jumat Bersih / Senam" },
                { start: "07:40", end: "09:00", name: "Mapel ke 1 Pancasila" },
                { start: "09:00", end: "09:40", name: "Mapel ke 2 B. Inggris" },
                { start: "09:40", end: "10:00", name: "Istirahat Pertama" },
                { start: "10:00", end: "11:20", name: "Mapel ke 3 IPA" },
                { start: "11:20", end: "23:59", name: "Sholat Jumat / Pulang" }
            ]
        }
    };

    function updateDashboard() {
        const now = new Date();
        const dayIdx = now.getDay();
        const hrs = String(now.getHours()).padStart(2, '0');
        const mins = String(now.getMinutes()).padStart(2, '0');
        const secs = String(now.getSeconds()).padStart(2, '0');
        const timeStr = `${hrs}:${mins}`;

        // Format Tanggal & Jam
        document.getElementById("datetime-display").innerText = 
            `${days[dayIdx]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()} | ${hrs}:${mins}:${secs} WIB`;

        const summaryContainer = document.getElementById("summary-list");
        const timelineContainer = document.getElementById("timeline-container");
        const dayTitle = document.getElementById("day-title");
        const statusDot = document.getElementById("status-dot");
        const statusText = document.getElementById("status-text");

        // Cek Libur (Sabtu / Minggu)
        if (dayIdx === 0 || dayIdx === 6 || !scheduleData[dayIdx]) {
            dayTitle.innerText = "HARI INI LIBUR";
            summaryContainer.innerHTML = `<li class="summary-item">Tidak Ada KBM</li>`;
            timelineContainer.innerHTML = `<div class="timeline-item"><span class="time-text">Full Day</span><span class="subject-text">Selamat Beristirahat / Libur Sekolah</span></div>`;
            statusDot.className = "status-dot status-white";
            statusText.innerText = "Libur Sekolah";
            return;
        }

        const data = scheduleData[dayIdx];
        dayTitle.innerText = `MATA PELAJARAN HARI INI (${days[dayIdx].toUpperCase()})`;

        // Isi Ringkasan Mapel
        summaryContainer.innerHTML = data.summary.map(s => `<li class="summary-item">${s}</li>`).join('');

        // Isi Rincian Waktu & Status Active
        let activeFound = false;
        timelineContainer.innerHTML = data.timeline.map(item => {
            let isActive = false;
            if (timeStr >= item.start && timeStr < item.end) {
                isActive = true;
                activeFound = true;
                
                // Set Status KBM
                if (item.name.includes("Istirahat")) {
                    statusDot.className = "status-dot status-yellow";
                    statusText.innerText = "Jam Istirahat";
                } else if (item.name.includes("Pulang")) {
                    statusDot.className = "status-dot status-white";
                    statusText.innerText = "KBM Selesai";
                } else {
                    statusDot.className = "status-dot status-green";
                    statusText.innerText = "Aktif Belajar";
                }
            }

            return `
                <div class="timeline-item ${isActive ? 'active' : ''}">
                    <span class="time-text">${item.start} - ${item.end === "23:59" ? "Selesai" : item.end}</span>
                    <span class="subject-text">${item.name}</span>
                </div>
            `;
        }).join('');

        // Jika diluar jam sekolah (misal pagi-pagi sekali)
        if (!activeFound) {
            if (timeStr < "06:30") {
                statusDot.className = "status-dot status-yellow";
                statusText.innerText = "Belum Masuk Sekolah";
            } else {
                statusDot.className = "status-dot status-white";
                statusText.innerText = "KBM Selesai";
            }
        }
    }

    // Update realtime setiap detik
    setInterval(updateDashboard, 1000);
    updateDashboard();
</script>

</body>
</html>
