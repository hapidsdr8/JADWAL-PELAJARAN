<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Pelajaran Real-Time</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        
        body { 
            background-color: #031326; 
            color: #e0f2fe; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 20px 15px; 
            transition: all 0.5s ease; 
        }

        /* Tema Event Spesifik */
        body.theme-17aug { background-color: #450a0a; }
        body.theme-17aug .container { background: #7f1d1d; border-color: #ef4444; }
        body.theme-17aug .header { background: linear-gradient(135deg, #dc2626, #991b1b); }
        body.theme-17aug .wave-svg path { fill: #991b1b; }

        body.theme-28jan { background-color: #022c22; }
        body.theme-28jan .container { background: #064e3b; border-color: #10b981; }
        body.theme-28jan .header { background: linear-gradient(135deg, #059669, #047857); }
        body.theme-28jan .wave-svg path { fill: #047857; }

        .container { 
            width: 100%; 
            max-width: 480px; 
            background: #072540; 
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0, 20, 40, 0.8); 
            border: 1px solid #0e4a7b; 
        }

        .header { 
            background: linear-gradient(135deg, #0284c7, #0369a1); 
            padding: 25px 20px 15px 20px; 
            text-align: center; 
        }

        .header h1 { 
            font-size: 1.4rem; 
            color: #ffffff; 
            margin-bottom: 6px; 
            text-transform: uppercase; 
            letter-spacing: 1px;
        }

        .datetime-box { 
            font-size: 0.85rem; 
            color: #bae6fd; 
            margin-bottom: 12px; 
            font-weight: 600; 
        }

        .main-status-badge { 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            background: rgba(3, 19, 38, 0.9); 
            padding: 8px 18px; 
            border-radius: 30px; 
            font-size: 0.9rem; 
            font-weight: 700; 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            transition: all 0.3s ease;
        }

        .wave-svg { display: block; width: 100%; height: 30px; }
        .wave-svg path { fill: #0369a1; }

        .content { padding: 20px; }

        .timeline { display: flex; flex-direction: column; gap: 12px; }

        .card { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 14px 16px; 
            border-radius: 12px; 
            border: 1px solid transparent; 
            transition: all 0.3s ease; 
        }

        .card-left { display: flex; align-items: center; gap: 10px; }
        .card-emoji { font-size: 1.1rem; }
        .card-title { font-size: 0.95rem; font-weight: 600; }
        .card-time { font-size: 0.85rem; font-weight: 700; }

        /* Status Colors & Glow */
        .status-upcoming { background: #093558; border-color: #38bdf8; color: #e0f2fe; }
        .status-upcoming .card-time { color: #38bdf8; }

        .status-active { 
            background: #064e3b; 
            border-color: #34d399; 
            color: #ecfdf5; 
            box-shadow: 0 0 15px rgba(52, 211, 153, 0.4); 
            animation: pulse-green 2s infinite ease-in-out;
        }
        .status-active .card-time { color: #34d399; }

        .status-break { 
            background: #713f12; 
            border-color: #facc15; 
            color: #fefce8; 
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.4); 
            animation: pulse-yellow 2s infinite ease-in-out;
        }
        .status-break .card-time { color: #facc15; }

        .status-done { background: #0f172a; border-color: #334155; color: #64748b; opacity: 0.6; }
        .status-done .card-time { color: #64748b; }

        .holiday-box { 
            text-align: center; 
            padding: 35px 20px; 
            background: #0284c7; 
            border-radius: 16px; 
            border: 2px solid #38bdf8; 
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); 
        }
        .holiday-box h2 { font-size: 1.8rem; color: #ffffff; margin-bottom: 8px; }
        .holiday-box p { color: #e0f2fe; font-weight: 600; }

        .quote-box { 
            margin-top: 20px; 
            background: #093558; 
            border: 1px solid #0e4a7b; 
            border-radius: 12px; 
            padding: 15px; 
            text-align: center; 
        }
        .quote-text { 
            font-size: 0.88rem; 
            color: #bae6fd; 
            font-style: italic; 
            line-height: 1.5; 
            font-weight: 500;
        }

        .event-music-player {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        .event-music-player p {
            font-size: 0.8rem;
            margin-bottom: 5px;
            font-weight: 600;
        }
        audio {
            width: 100%;
            height: 32px;
        }

        @keyframes pulse-green {
            0%, 100% { box-shadow: 0 0 12px rgba(52, 211, 153, 0.3); }
            50% { box-shadow: 0 0 22px rgba(52, 211, 153, 0.7); }
        }
        @keyframes pulse-yellow {
            0%, 100% { box-shadow: 0 0 12px rgba(250, 204, 21, 0.3); }
            50% { box-shadow: 0 0 22px rgba(250, 204, 21, 0.7); }
        }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <div class="header">
        <h1>Jadwal Pelajaran</h1>
        <div class="datetime-box">
            <span id="date-display">--</span> • <span id="clock-display">00:00:00 WIB</span>
        </div>
        <div class="main-status-badge" id="main-status-badge">
            <span id="main-status-text">Memuat status...</span>
        </div>
    </div>

    <svg class="wave-svg" viewBox="0 0 500 150" preserveAspectRatio="none">
        <path d="M0.00,49.98 C150.00,150.00 349.20,-49.98 500.00,49.98 L500.00,0.00 L0.00,0.00 Z"></path>
    </svg>

    <div class="content">
        <div class="timeline" id="timeline-container"></div>
        
        <div class="quote-box">
            <p class="quote-text" id="daily-quote">Memuat kata-kata motivasi...</p>
        </div>

        <div class="event-music-player" id="event-music-box">
            <p id="event-music-title">🎵 Musik Spesial Event</p>
            <audio id="event-audio" controls loop></audio>
        </div>
    </div>
</div>

<script>
    const quotes = [
        "semangat yaa dee hari ini, kalo ada apa apa cerita sama aa yaa 🤍",
        "semangat sekolahnya yaa dee, jangan lupa nikmatin harinya juga",
        "dee jangan lupa makan yaa, jangan sampe sibuk terus sampe lupa sama diri sendiri",
        "kalo hari ini kerasa cape, istirahat bentar yaa dee, ga harus selalu kuat setiap saat",
        "dee jangan ovt terus yaa, yang belum tentu terjadi jangan dipikirin sekarang",
        "kalo ada yang bikin dee sedih, cerita sama aa yaa, jangan dipendem sendirian",
        "semoga hari ini semua urusan dee dilancarin yaa",
        "jangan terlalu mikirin omongan orang yaa dee, ga semua omongan harus dee masukin hati",
        "hari ini senyum yang banyak yaa dee, jangan sampe ada yang bikin mood dee rusak",
        "semangat yaa dee, pelan pelan gapapa yang penting terus maju",
        "dee jangan lupa istirahat yaa, badan juga butuh waktu buat tenang",
        "kalo hari ini ada yang bikin dee kesel, jangan dipikirin terlalu lama yaa",
        "semoga hari ini dee ketemu banyak hal baik yaa",
        "dee jangan ngerasa sendirian yaa, kalo butuh tempat cerita ada aa",
        "jangan takut gagal yaa dee, namanya juga proses, yang penting dee udah berusaha",
        "semangat terus yaa dee, aa percaya dee bisa lewatin hari ini",
        "kalo ada masalah jangan langsung nyalahin diri sendiri yaa dee",
        "dee boleh cape, boleh sedih, tapi jangan nyerah yaa",
        "semoga hari ini hati dee lebih tenang dan pikiran dee lebih ringan",
        "jangan lupa senyum yaa dee, senyum dee jangan sampe kalah sama masalah",
        "dee ga harus sempurna setiap hari kok, cukup jadi versi dee yang terus berusaha",
        "semangat yaa dee, satu satu aja masalahnya, ga perlu dipikirin semuanya sekaligus",
        "kalo hari ini ga sesuai harapan, gapapa, besok masih ada kesempatan lagi",
        "jangan terlalu keras sama diri sendiri yaa dee, dee juga manusia yang butuh istirahat",
        "semoga hari ini ga ada yang bikin dee kepikiran sampe malem",
        "dee kalo lagi bingung jangan dipendem sendiri, cerita aja sama aa",
        "jaga diri baik baik yaa dee, jangan lupa minum dan makan",
        "semoga sekolah hari ini seru yaa dee, jangan lupa nikmatin momen kecilnya",
        "dee jangan bandingin diri dee sama orang lain yaa, setiap orang punya waktunya masing masing",
        "semangat yaa dee, aa selalu dukung dee dari sini 🤍",
        "hari ini harus lebih kuat yaa dee, tapi kalo cape gapapa istirahat",
        "jangan takut cerita sama aa yaa dee, aa ga bakal bosen dengerin cerita dee",
        "semoga apa yang dee usahain hari ini ada hasil baiknya nanti",
        "dee jangan terlalu banyak mikir sebelum tidur yaa, istirahatin pikiran dee",
        "semoga hari dee dipenuhi hal hal kecil yang bikin dee senyum",
        "semangat yaa dee, jangan lupa kalo dee udah sejauh ini dan itu ga gampang",
        "apa pun yang terjadi hari ini, jangan lupa pulang dengan hati yang tenang yaa dee",
        "dee harus percaya sama diri sendiri yaa, dee lebih kuat dari yang dee kira",
        "semoga hari ini lebih ringan dari yang dee bayangin",
        "jangan lupa kabarin aa yaa dee kalo ada apa apa, aa siap dengerin",
        "semangat yaa dee, jalanin aja hari ini pelan pelan, nanti juga selesai 🤍"
    ];

    const scheduleData = {
        1: [
            { start: "07:00", end: "07:40", name: "Upacara Bendera", isBreak: false },
            { start: "07:40", end: "09:00", name: "Matematika", isBreak: false },
            { start: "09:00", end: "09:30", name: "Istirahat", isBreak: true },
            { start: "09:30", end: "11:00", name: "PAI", isBreak: false },
            { start: "11:00", end: "12:30", name: "IPA", isBreak: false }
        ],
        2: [
            { start: "07:40", end: "09:00", name: "Bahasa Inggris", isBreak: false },
            { start: "09:00", end: "09:40", name: "PPKn (Sesi 1)", isBreak: false },
            { start: "09:40", end: "10:00", name: "Istirahat", isBreak: true },
            { start: "10:00", end: "10:40", name: "PPKn (Sesi 2)", isBreak: false },
            { start: "10:40", end: "12:00", name: "IPS (Sesi 1)", isBreak: false },
            { start: "12:00", end: "12:40", name: "Istirahat 2", isBreak: true },
            { start: "12:40", end: "14:00", name: "IPS (Sesi 2)", isBreak: false }
        ],
        3: [
            { start: "07:30", end: "09:00", name: "Bahasa Inggris", isBreak: false },
            { start: "09:00", end: "09:30", name: "Istirahat", isBreak: true },
            { start: "09:30", end: "11:00", name: "IPS", isBreak: false },
            { start: "11:00", end: "12:30", name: "PJOK", isBreak: false }
        ],
        4: [
            { start: "07:30", end: "09:00", name: "Bahasa Indonesia", isBreak: false },
            { start: "09:00", end: "09:30", name: "Istirahat", isBreak: true },
            { start: "09:30", end: "11:00", name: "Prakarya", isBreak: false },
            { start: "11:00", end: "12:30", name: "TIK", isBreak: false }
        ],
        5: [
            { start: "07:30", end: "09:00", name: "Bahasa Sunda", isBreak: false },
            { start: "09:00", end: "09:30", name: "Istirahat", isBreak: true },
            { start: "09:30", end: "10:40", name: "Persiapan Sholat Jumat", isBreak: false }
        ]
    };

    function timeToMinutes(timeStr) {
        const [hours, minutes] = timeStr.split(':').map(Number);
        return hours * 60 + minutes;
    }

    function getWIBDate() {
        const now = new Date();
        const wibString = now.toLocaleString("en-US", { timeZone: "Asia/Jakarta" });
        return new Date(wibString);
    }

    let currentEventPlaying = "";

    function updateDashboard() {
        const wibNow = getWIBDate();
        const currentDay = wibNow.getDay(); 
        const currentMinutes = wibNow.getHours() * 60 + wibNow.getMinutes();
        const date = wibNow.getDate();
        const month = wibNow.getMonth();

        document.getElementById("clock-display").innerText = wibNow.toLocaleTimeString('id-ID') + " WIB";
        document.getElementById("date-display").innerText = wibNow.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

        const container = document.getElementById("timeline-container");
        const mainBadgeText = document.getElementById("main-status-text");
        const mainBadge = document.getElementById("main-status-badge");
        const quoteElement = document.getElementById("daily-quote");
        
        const musicBox = document.getElementById("event-music-box");
        const audioPlayer = document.getElementById("event-audio");
        const musicTitle = document.getElementById("event-music-title");

        document.body.className = "";
        
        if (date === 17 && month === 7) { 
            document.body.classList.add("theme-17aug");
            musicBox.style.display = "block";
            musicTitle.innerText = "🇲🇨 Musik Spesial 17 Agustus";
            if (currentEventPlaying !== "17aug") {
                audioPlayer.src = "Indonesiansong.mp3";
                currentEventPlaying = "17aug";
            }
        } else if (date === 28 && month === 0) { 
            document.body.classList.add("theme-28jan");
            musicBox.style.display = "block";
            musicTitle.innerText = "🎉 Musik Spesial Ulang Tahun (28 Jan)";
            if (currentEventPlaying !== "28jan") {
                audioPlayer.src = "ulangtahun.mp3";
                currentEventPlaying = "28jan";
            }
        } else {
            musicBox.style.display = "none";
            if (currentEventPlaying !== "") {
                audioPlayer.pause();
                currentEventPlaying = "";
            }
        }

        if (currentDay === 0 || currentDay === 6) {
            quoteElement.innerText = `"dee hari ini libur, kalo kemana mana kabarin a dan jangan nakal"`;
        } else {
            const dateSeed = wibNow.getFullYear() * 10000 + (wibNow.getMonth() + 1) * 100 + wibNow.getDate();
            const selectedQuoteIndex = dateSeed % quotes.length;
            quoteElement.innerText = `"${quotes[selectedQuoteIndex]}"`;
        }

        if (currentDay === 0 || currentDay === 6) {
            mainBadgeText.innerHTML = "🏖️ LIBUR";
            mainBadge.style.color = "#38bdf8";
            container.innerHTML = `
                <div class="holiday-box">
                    <h2>🏖️ LIBUR</h2>
                    <p>Tidak ada kegiatan KBM hari ini. Selamat beristirahat!</p>
                </div>
            `;
            return;
        }

        const todaySchedule = scheduleData[currentDay];
        if (!todaySchedule || todaySchedule.length === 0) return;

        const firstStart = timeToMinutes(todaySchedule[0].start);
        const lastEnd = timeToMinutes(todaySchedule[todaySchedule.length - 1].end);

        if (currentMinutes < firstStart) {
            mainBadgeText.innerHTML = "🕐 Belum Dimulai";
            mainBadge.style.color = "#38bdf8";
        } else if (currentMinutes >= lastEnd) {
            mainBadgeText.innerHTML = "🔴 Selesai / Pulang / Off";
            mainBadge.style.color = "#fca5a5";
        } else {
            let activeItem = todaySchedule.find(item => {
                const start = timeToMinutes(item.start);
                const end = timeToMinutes(item.end);
                return currentMinutes >= start && currentMinutes < end;
            });

            if (activeItem && activeItem.isBreak) {
                mainBadgeText.innerHTML = "🟡 Istirahat";
                mainBadge.style.color = "#facc15";
            } else {
                mainBadgeText.innerHTML = "🟢 Sedang Berlangsung";
                mainBadge.style.color = "#34d399";
            }
        }

        container.innerHTML = "";
        todaySchedule.forEach(item => {
            const startMin = timeToMinutes(item.start);
            const endMin = timeToMinutes(item.end);

            let statusClass = "";
            let emoji = "";

            if (currentMinutes >= lastEnd || currentMinutes >= endMin) {
                statusClass = "status-done";
                emoji = "⚪";
            } else if (currentMinutes >= startMin && currentMinutes < endMin) {
                if (item.isBreak) {
                    statusClass = "status-break";
                    emoji = "🟡";
                } else {
                    statusClass = "status-active";
                    emoji = "🟢";
                }
            } else {
                statusClass = "status-upcoming";
                emoji = "🕐";
            }

            container.innerHTML += `
                <div class="card ${statusClass}">
                    <div class="card-left">
                        <span class="card-emoji">${emoji}</span>
                        <span class="card-title">${item.name}</span>
                    </div>
                    <span class="card-time">${item.start} - ${item.end}</span>
                </div>
            `;
        });
    }

    setInterval(updateDashboard, 1000);
    updateDashboard();
</script>

</body>
</html>
